---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html
    - /bin/mkdir -p $DEPLOYPATH/api/storage/app/public
    - /bin/mkdir -p $DEPLOYPATH/api/storage/app/private
    - /bin/mkdir -p $DEPLOYPATH/api/storage/framework/cache/data
    - /bin/mkdir -p $DEPLOYPATH/api/storage/framework/sessions
    - /bin/mkdir -p $DEPLOYPATH/api/storage/framework/testing
    - /bin/mkdir -p $DEPLOYPATH/api/storage/framework/views
    - /bin/mkdir -p $DEPLOYPATH/api/storage/logs
    - /bin/mkdir -p $DEPLOYPATH/api/bootstrap/cache
    - /bin/chmod -R 775 $DEPLOYPATH/api/storage
    - /bin/chmod -R 775 $DEPLOYPATH/api/bootstrap/cache
    - /bin/cp -R public_html/assets $DEPLOYPATH/
    - /bin/cp public_html/index.html $DEPLOYPATH/
    - /bin/cp public_html/favicon.png $DEPLOYPATH/
    - /bin/cp public_html/favicon.svg $DEPLOYPATH/
    - /bin/cp public_html/icons.svg $DEPLOYPATH/
    - /bin/cp public_html/.htaccess $DEPLOYPATH/
    - /bin/cp -R public_html/api/app $DEPLOYPATH/api/
    - /bin/cp -R public_html/api/bootstrap $DEPLOYPATH/api/
    - /bin/cp -R public_html/api/config $DEPLOYPATH/api/
    - /bin/cp -R public_html/api/database $DEPLOYPATH/api/
    - /bin/cp -R public_html/api/public $DEPLOYPATH/api/
    - /bin/cp -R public_html/api/resources $DEPLOYPATH/api/
    - /bin/cp -R public_html/api/routes $DEPLOYPATH/api/
    - /bin/cp public_html/api/artisan $DEPLOYPATH/api/
    - /bin/cp public_html/api/composer.json $DEPLOYPATH/api/
    - /bin/cp public_html/api/composer.lock $DEPLOYPATH/api/
    - /bin/cp public_html/api/.htaccess $DEPLOYPATH/api/
    - cd $DEPLOYPATH/api && COMPOSER_BIN=$(which composer 2>/dev/null || which composer.phar 2>/dev/null || echo "composer") && $COMPOSER_BIN install --no-dev --prefer-dist --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH/api && php artisan config:clear
    - cd $DEPLOYPATH/api && php artisan route:clear
    - cd $DEPLOYPATH/api && php artisan view:clear
    - cd $DEPLOYPATH/api && php artisan cache:clear
